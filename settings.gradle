pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenLocal()
        mavenCentral()
    }
}

rootProject.name = 'cobble-parent'

include 'cobble-lang'
include 'cobble-dynamic'
include 'cobble-loader'
include 'cobble-settings'
include 'cobble-all'
