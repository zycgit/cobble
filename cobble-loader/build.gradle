plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.gradleup.shadow'
}

ext.pomName = 'Cobble Loader'
description = 'Resource loader utilities.'

configurations {
    shaded
}

dependencies {
    api project(':cobble-lang')
    compileOnly "org.ow2.asm:asm:${property('lib.asm')}"
    shaded "org.ow2.asm:asm:${property('lib.asm')}"
    testImplementation "org.ow2.asm:asm:${property('lib.asm')}"
}

tasks.named('shadowJar') {
    configurations = [project.configurations.shaded]
    relocate 'org.objectweb.asm', 'net.hasor.cobble.asm'
    exclude 'META-INF/MANIFEST.MF'
    exclude 'module-info.class'
    manifest {
        attributes 'Automatic-Module-Name': 'net.hasor.cobble.loader'
    }
}
