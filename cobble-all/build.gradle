plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.gradleup.shadow'
}

dependencies {
    implementation "org.ow2.asm:asm:${property('lib.asm')}"
    implementation "org.yaml:snakeyaml:${property('lib.snakeyaml')}"
}

tasks.named('shadowJar') {
    archiveClassifier = 'all'
    dependsOn ':cobble-lang:shadowJar'
    dependsOn ':cobble-dynamic:shadowJar'
    dependsOn ':cobble-settings:shadowJar'
    dependsOn ':cobble-loader:shadowJar'
    from {
        [
                project(':cobble-lang').tasks.named('shadowJar').get().archiveFile,
                project(':cobble-dynamic').tasks.named('shadowJar').get().archiveFile,
                project(':cobble-settings').tasks.named('shadowJar').get().archiveFile,
                project(':cobble-loader').tasks.named('shadowJar').get().archiveFile
        ].collect { zipTree(it) }
    }
    relocate 'org.objectweb.asm', 'net.hasor.cobble.asm'
    relocate 'org.yaml.snakeyaml', 'net.hasor.cobble.setting.provider.yaml.lib'
    exclude 'META-INF/MANIFEST.MF'
    exclude 'module-info.class'
    exclude 'META-INF/**'
    manifest {
        attributes 'Automatic-Module-Name': 'net.hasor.cobble'
    }
}
