plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.gradleup.shadow'
}

dependencies {
    api project(':cobble-lang')
    implementation "org.yaml:snakeyaml:${property('lib.snakeyaml')}"
}

tasks.named('shadowJar') {
    archiveClassifier = 'all'
    relocate 'org.yaml.snakeyaml', 'net.hasor.cobble.setting.provider.yaml.lib'
    dependencies {
        include dependency('org.yaml:snakeyaml:.*')
    }
    exclude 'META-INF/**'
    manifest {
        attributes 'Automatic-Module-Name': 'net.hasor.cobble.setting'
    }
}
