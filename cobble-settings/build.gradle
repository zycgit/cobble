plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.gradleup.shadow'
}

ext.pomName = 'Cobble Settings'
description = 'Configuration reader utilities.'

configurations {
    shaded
}

dependencies {
    api project(':cobble-lang')
    compileOnly "org.yaml:snakeyaml:${property('lib.snakeyaml')}"
    shaded "org.yaml:snakeyaml:${property('lib.snakeyaml')}"
    testImplementation "org.yaml:snakeyaml:${property('lib.snakeyaml')}"
}

tasks.named('shadowJar') {
    configurations = [project.configurations.shaded]
    relocate 'org.yaml.snakeyaml', 'net.hasor.cobble.setting.provider.yaml.lib'
    exclude 'META-INF/**'
    manifest {
        attributes 'Automatic-Module-Name': 'net.hasor.cobble.setting'
    }
}
